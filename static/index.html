<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Чат</title>
    <!-- Ссылка на наш CSS файл -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Главный контейнер для всего интерфейса чата -->
    <div class="chat-container">
        <!-- Секция заголовка -->
        <div class="header">
            <h1>🤖 Чат с LLaMA</h1>
            <p>Работает на Hugging Face</p>
            <button id="new-chat-btn" type="button">Новый чат</button>
        </div>

        <!-- Область отображения сообщений -->
        <div id="messages" class="messages">
            <div class="message bot-message">
                <strong>Ассистент:</strong> Привет! Я готов к общению. Спрашивай что угодно!
            </div>
        </div>

        <!-- Область ввода -->
        <div class="input-container">
            <input
                type="text"
                id="user-input"
                placeholder="Введите ваше сообщение здесь..."
                autocomplete="off"
            >
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <!-- JavaScript файл (логика добавлена в Фазе 4) -->
    <script src="/static/script.js"></script>
</body>
</html>
